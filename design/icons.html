<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Geo Quiz — Icon candidates</title>
<style>
@font-face{font-family:Geist;src:url("../assets/fonts/Geist-Variable.ttf") format("truetype");font-weight:100 900;font-display:swap}
:root{--bg:#202020;--panel:#2b2b2b;--line:#414141;--text:#e9e7e2;--muted:#aaa8a3;--accent:#9f8dce}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Geist,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;padding:20px 16px 48px}
h1{font-size:22px;margin:0 0 4px}
.sub{color:var(--muted);font-size:13px;margin-bottom:20px;line-height:1.5}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px}
.head{display:flex;align-items:baseline;gap:10px;margin-bottom:14px}
.tag{width:26px;height:26px;flex:0 0 26px;border-radius:8px;background:var(--accent);color:var(--bg);font-weight:800;font-size:15px;display:flex;align-items:center;justify-content:center}
.name{font-weight:700;font-size:15px}
.note{color:var(--muted);font-size:12px}
.row{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap}
.spec{display:flex;flex-direction:column;align-items:center;gap:6px}
.spec span{color:var(--muted);font-size:10px;letter-spacing:.3px}
.s150{width:150px;height:150px;border-radius:34px}
.s76{width:76px;height:76px;border-radius:17px}
.s56{width:56px;height:56px;border-radius:13px}
.circ{width:56px;height:56px;border-radius:50%}
svg.shot{display:block;overflow:hidden}
.legend{color:var(--muted);font-size:12px;line-height:1.6;margin-top:18px}
.legend b{color:var(--text)}
</style>
</head>
<body>
<h1>Geo Quiz — 아이콘 후보</h1>
<div class="sub">각 줄은 왼쪽부터 150px · 76px(홈 화면 크기) · 56px · 원형 크롭(안드로이드)입니다.<br>E가 현재 적용된 아이콘입니다. 바꾸고 싶은 걸 알파벳으로 알려주세요.</div>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="lav" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b6a4e3"/><stop offset=".55" stop-color="#9f8dce"/><stop offset="1" stop-color="#8674b9"/>
    </linearGradient>
    <radialGradient id="sheen" cx="30%" cy="18%" r="75%">
      <stop offset="0" stop-color="#fff" stop-opacity=".22"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="graph" cx="35%" cy="25%">
      <stop offset="0" stop-color="#333"/><stop offset="1" stop-color="#1c1c1c"/>
    </radialGradient>

    <symbol id="A" viewBox="0 0 512 512">
      <rect width="512" height="512" fill="url(#lav)"/><rect width="512" height="512" fill="url(#sheen)"/>
      <g fill="none" stroke="#1f1d26" stroke-width="16" stroke-linecap="round" transform="translate(256,198)">
        <circle r="112"/><ellipse rx="50" ry="112"/><line x1="0" y1="-112" x2="0" y2="112"/>
        <line x1="-112" y1="0" x2="112" y2="0"/><line x1="-97" y1="-56" x2="97" y2="-56"/><line x1="-97" y1="56" x2="97" y2="56"/>
      </g>
      <text x="256" y="408" font-size="70" font-weight="800" letter-spacing="1" text-anchor="middle" fill="#1f1d26" font-family="Geist">GEO QUIZ</text>
    </symbol>

    <symbol id="B" viewBox="0 0 512 512">
      <rect width="512" height="512" fill="url(#graph)"/>
      <g fill="none" stroke="#9f8dce" stroke-width="20" stroke-linecap="round" transform="translate(256,256)">
        <circle r="150"/><ellipse rx="67" ry="150"/><line x1="0" y1="-150" x2="0" y2="150"/>
        <line x1="-150" y1="0" x2="150" y2="0"/><line x1="-130" y1="-75" x2="130" y2="-75"/><line x1="-130" y1="75" x2="130" y2="75"/>
      </g>
    </symbol>

    <symbol id="C" viewBox="0 0 512 512">
      <rect width="512" height="512" fill="#232323"/>
      <g fill="none" stroke-width="20" stroke-linecap="round" transform="translate(256,256)">
        <circle r="150" stroke="#9f8dce"/><ellipse rx="67" ry="150" stroke="#9f8dce" opacity=".9"/>
        <line x1="0" y1="-150" x2="0" y2="150" stroke="#9f8dce" opacity=".9"/>
        <line x1="-150" y1="0" x2="150" y2="0" stroke="#beb874"/>
        <line x1="-130" y1="-75" x2="130" y2="-75" stroke="#c7996b"/>
        <line x1="-130" y1="75" x2="130" y2="75" stroke="#c7996b"/>
      </g>
    </symbol>

    <symbol id="D" viewBox="0 0 512 512">
      <rect width="512" height="512" fill="url(#lav)"/><rect width="512" height="512" fill="url(#sheen)"/>
      <g fill="none" stroke="#1f1d26" stroke-width="19" stroke-linecap="round" transform="translate(238,246)">
        <circle r="140"/><ellipse rx="63" ry="140"/><line x1="0" y1="-140" x2="0" y2="140"/>
        <line x1="-140" y1="0" x2="140" y2="0"/><line x1="-121" y1="-70" x2="121" y2="-70"/><line x1="-121" y1="70" x2="121" y2="70"/>
      </g>
      <circle cx="392" cy="392" r="86" fill="#1f1d26"/>
      <text x="392" y="430" font-size="120" font-weight="800" text-anchor="middle" fill="#b3a1e0" font-family="Geist">?</text>
    </symbol>

    <symbol id="E" viewBox="0 0 512 512">
      <rect width="512" height="512" fill="#232323"/>
      <g fill="none" stroke="#9f8dce" stroke-width="14" opacity=".28" transform="translate(256,256)">
        <circle r="172"/><ellipse rx="77" ry="172"/><line x1="-172" y1="0" x2="172" y2="0"/>
        <line x1="-149" y1="-86" x2="149" y2="-86"/><line x1="-149" y1="86" x2="149" y2="86"/>
      </g>
      <text x="256" y="318" font-size="210" font-weight="800" letter-spacing="-6" text-anchor="middle" fill="#9f8dce" font-family="Geist">GQ</text>
    </symbol>

    <symbol id="F" viewBox="0 0 512 512">
      <rect width="512" height="512" fill="url(#lav)"/><rect width="512" height="512" fill="url(#sheen)"/>
      <g fill="none" stroke="#1f1d26" stroke-width="22" stroke-linecap="round" transform="translate(256,256)">
        <circle r="152"/><ellipse rx="68" ry="152"/><line x1="0" y1="-152" x2="0" y2="152"/>
        <line x1="-152" y1="0" x2="152" y2="0"/><line x1="-132" y1="-76" x2="132" y2="-76"/><line x1="-132" y1="76" x2="132" y2="76"/>
      </g>
    </symbol>
  </defs>
</svg>

<div id="list"></div>

<div class="legend">
  <b>고르는 기준</b><br>
  · 홈 화면에는 아이콘 아래에 "Geo Quiz" 이름이 이미 표시되므로, 아이콘 안의 글자는 없어도 됩니다.<br>
  · 어두운 배경(B·C·E)은 어두운 배경화면에서 눈에 덜 띌 수 있습니다.<br>
  · 원형 크롭은 안드로이드 일부 런처에만 해당합니다. iPhone은 둥근 사각형이라 잘림이 적습니다.
</div>

<script>
const CANDS=[
  ['A','라벤더 + 지구본 + GEO QUIZ','이름이 들어가 있고 대비가 가장 강하다.'],
  ['F','라벤더 + 큰 지구본','A에서 글자를 빼고 지구본을 키운 것. 작은 크기에서 가장 또렷하다.'],
  ['B','그래파이트 + 라벤더 지구본','앱 화면과 가장 비슷한 톤. 미니멀하다.'],
  ['C','지구본 선을 세 모드 색으로','국기·지도·수도 세 모드를 은근히 반영.'],
  ['D','라벤더 + 지구본 + ? 배지','퀴즈라는 게 바로 드러난다. 원형 크롭에서 배지가 잘린다.'],
  ['E','GQ 모노그램','현재 적용됨. 기존 아이콘의 현대적 버전.'],
];
document.getElementById('list').innerHTML=CANDS.map(([id,name,note])=>`
  <div class="card">
    <div class="head"><span class="tag">${id}</span><span class="name">${name}</span></div>
    <div class="note" style="margin:-8px 0 14px">${note}</div>
    <div class="row">
      ${[['s150','150px'],['s76','76px · 홈 화면'],['s56','56px'],['circ','원형']].map(([cls,label])=>`
        <div class="spec"><svg class="shot ${cls}"><use href="#${id}"/></svg><span>${label}</span></div>`).join('')}
    </div>
  </div>`).join('');
</script>
</body>
</html>
